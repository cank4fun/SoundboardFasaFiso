name: Windows Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Windows release with WebRTC AEC3
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SOUNDBOARD_VCPKG_ROOT: ${{ github.workspace }}\_vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up x64 MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-vcpkg-aec3-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            windows-vcpkg-aec3-

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $root = $env:SOUNDBOARD_VCPKG_ROOT
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          git clone https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" version

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 3

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content "CMakeLists.txt" -Raw
          $match = [regex]::Match(
            $content,
            'set\(SOUNDBOARD_VERSION "([^"]+)"\)'
          )

          if (-not $match.Success) {
            throw "Project version could not be read from CMakeLists.txt."
          }

          $expectedTag = "v$($match.Groups[1].Value)"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
            throw "Tag $actualTag does not match project version $expectedTag."
          }

      - name: Configure Release build with WebRTC AEC3
        shell: pwsh
        run: >-
          cmake -S . -B out/build/ci-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.SOUNDBOARD_VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=webrtc-aec3
          -DSOUNDBOARD_ENABLE_WEBRTC_AEC3=ON
          -DSOUNDBOARD_BUILD_WEBRTC_AEC3_TESTS=ON
          -DSOUNDBOARD_WARNINGS_AS_ERRORS=ON

      - name: Build microphone processing tests
        shell: pwsh
        run: >-
          cmake --build out/build/ci-release
          --target
          SoundBoardFasaFisoMicrophoneProcessingSettingsTests
          SoundBoardFasaFisoPlaybackModeTests
          SoundBoardFasaFisoConfigMicrophoneProcessingTests
          SoundBoardFasaFisoMicrophoneProcessorTests
          SoundBoardFasaFisoMicrophoneProcessingRuntimeTests
          SoundBoardFasaFisoRnNoiseSuppressorTests
          SoundBoardFasaFisoWebRtcAec3Smoke
          SoundBoardFasaFisoWebRtcAec3ProcessorTests
          SoundBoardFasaFisoAecRenderReferenceMixerTests
          SoundBoardFasaFisoMicrophoneProcessingAecRuntimeTests
          --parallel

      - name: Run tests
        shell: pwsh
        run: >-
          ctest --test-dir out/build/ci-release
          --output-on-failure

      - name: Build portable package
        shell: pwsh
        run: >-
          cmake --build out/build/ci-release
          --target PortableRelease
          --parallel

      - name: Verify portable package and create checksum
        shell: pwsh
        run: |
          $archives = @(
            Get-ChildItem "out/build/ci-release" `
              -File `
              -Filter "SoundBoardFasaFiso-v*-windows-x64-portable.zip"
          )

          if ($archives.Count -ne 1) {
            throw "Expected exactly one versioned portable ZIP, found $($archives.Count)."
          }

          $zip = $archives[0].FullName
          $extract = Join-Path $env:RUNNER_TEMP "soundboard-portable-check"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $extract

          $root = Join-Path $extract "SoundBoardFasaFiso"
          $required = @(
            "SoundBoardFasaFiso.exe",
            "config.txt",
            "README.txt",
            "LICENSE",
            "THIRD_PARTY_NOTICES.txt",
            "WEBRTC_THIRD_PARTY_NOTICES.txt",
            "sounds"
          )

          foreach ($item in $required) {
            $path = Join-Path $root $item
            if (-not (Test-Path $path)) {
              throw "Portable package is missing: $item"
            }
          }

          $unexpected = @(
            Get-ChildItem $root |
              Where-Object { $_.Name -notin $required }
          )

          if ($unexpected.Count -ne 0) {
            $names = ($unexpected.Name -join ", ")
            throw "Portable package contains unexpected top-level items: $names"
          }

          $config = Get-Content (Join-Path $root "config.txt") -Raw
          $requiredDefaults = @(
            '(?m)^output=default$',
            '(?m)^monitor=none$',
            '(?m)^microphone_processing_enabled=false$',
            '(?m)^microphone_echo_cancellation_enabled=false$',
            '(?m)^show_console_on_start=false$'
          )

          foreach ($pattern in $requiredDefaults) {
            if ($config -notmatch $pattern) {
              throw "Portable config is missing required safe default: $pattern"
            }
          }

          $webrtcNotices = Join-Path $root "WEBRTC_THIRD_PARTY_NOTICES.txt"
          if ((Get-Item $webrtcNotices).Length -lt 1024) {
            throw "Generated WebRTC third-party notices are unexpectedly small."
          }

          $sounds = @(
            Get-ChildItem (Join-Path $root "sounds") -File -Recurse
          )

          if ($sounds.Count -eq 0) {
            throw "Portable package contains no example sounds."
          }

          $invalidSounds = @(
            $sounds |
              Where-Object { $_.Extension.ToLowerInvariant() -notin @(".wav", ".mp3", ".flac") }
          )

          if ($invalidSounds.Count -ne 0) {
            $names = ($invalidSounds.FullName -join ", ")
            throw "Portable package contains unsupported sound files: $names"
          }

          $hash = Get-FileHash $zip -Algorithm SHA256
          $checksum = "$zip.sha256"
          "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($zip))" |
            Set-Content $checksum -Encoding ascii

          "PORTABLE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PORTABLE_SHA256=$checksum" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Portable ZIP: $zip"
          Write-Host "Size: $((Get-Item $zip).Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.PORTABLE_SHA256 }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = $env:PORTABLE_ZIP
          $checksum = $env:PORTABLE_SHA256
          $title = "SoundBoardFasaFiso $tag"
          $notes = "docs/releases/$tag.md"

          gh release view $tag 2>$null | Out-Null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $checksum --clobber
          }
          else {
            $arguments = @(
              "release", "create", $tag, $zip, $checksum,
              "--title", $title,
              "--verify-tag"
            )

            if (Test-Path $notes) {
              $arguments += @("--notes-file", $notes)
            }
            else {
              $arguments += "--generate-notes"
            }

            if ($tag -match "-") {
              $arguments += "--prerelease"
            }

            & gh @arguments
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed."
          }
