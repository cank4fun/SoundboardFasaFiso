name: Windows Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Windows release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 3

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content "CMakeLists.txt" -Raw
          $match = [regex]::Match(
              $content,
              'project\(SoundBoardFasaFiso VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          )

          if (-not $match.Success) {
              throw "Project version could not be read from CMakeLists.txt."
          }

          $expectedTag = "v$($match.Groups[1].Value)"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
              throw "Tag $actualTag does not match project version $expectedTag."
          }

      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake -S . -B out/build/ci-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSOUNDBOARD_WARNINGS_AS_ERRORS=ON

      - name: Build portable package
        shell: pwsh
        run: >-
          cmake --build out/build/ci-release
          --target PortableRelease
          --parallel

      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          $zip = "out/build/ci-release/SoundBoardFasaFiso-portable.zip"

          if (-not (Test-Path $zip)) {
              throw "Portable ZIP was not created: $zip"
          }

          $extract = Join-Path $env:RUNNER_TEMP "soundboard-portable-check"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $extract

          $root = Join-Path $extract "SoundBoardFasaFiso"
          $required = @(
              "SoundBoardFasaFiso.exe",
              "config.txt",
              "README.txt",
              "sounds"
          )

          foreach ($item in $required) {
              $path = Join-Path $root $item
              if (-not (Test-Path $path)) {
                  throw "Portable package is missing: $item"
              }
          }

          $sounds = Get-ChildItem (Join-Path $root "sounds") -File
          if ($sounds.Count -eq 0) {
              throw "Portable package contains no example sounds."
          }

          $file = Get-Item $zip
          $hash = Get-FileHash $zip -Algorithm SHA256
          Write-Host "Portable ZIP: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/build/ci-release/SoundBoardFasaFiso-portable.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "out/build/ci-release/SoundBoardFasaFiso-portable.zip"
          $title = "SoundBoardFasaFiso $tag"

          gh release view $tag 2>$null | Out-Null

          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zip --clobber
          }
          else {
              gh release create $tag $zip --title $title --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publishing failed."
          }
