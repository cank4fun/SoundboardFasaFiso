name: Windows Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_defender_sample:
        description: Create a password-protected Microsoft Defender submission sample
        required: false
        type: boolean
        default: false
      defender_sample_tag:
        description: Release tag to package for Microsoft analysis
        required: false
        type: string
        default: v2.0.0-rc.1

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Windows release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up x64 MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 3

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content "CMakeLists.txt" -Raw
          $match = [regex]::Match(
            $content,
            'set\(SOUNDBOARD_VERSION "([^"]+)"\)'
          )

          if (-not $match.Success) {
            throw "Project version could not be read from CMakeLists.txt."
          }

          $expectedTag = "v$($match.Groups[1].Value)"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
            throw "Tag $actualTag does not match project version $expectedTag."
          }

      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake -S . -B out/build/ci-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSOUNDBOARD_WARNINGS_AS_ERRORS=ON

      - name: Build portable package
        shell: pwsh
        run: >-
          cmake --build out/build/ci-release
          --target PortableRelease
          --parallel

      - name: Verify portable package and create checksum
        shell: pwsh
        run: |
          $archives = @(
            Get-ChildItem "out/build/ci-release" `
              -File `
              -Filter "SoundBoardFasaFiso-v*-windows-x64-portable.zip"
          )

          if ($archives.Count -ne 1) {
            throw "Expected exactly one versioned portable ZIP, found $($archives.Count)."
          }

          $zip = $archives[0].FullName
          $extract = Join-Path $env:RUNNER_TEMP "soundboard-portable-check"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $extract

          $root = Join-Path $extract "SoundBoardFasaFiso"
          $required = @(
            "SoundBoardFasaFiso.exe",
            "config.txt",
            "README.txt",
            "LICENSE",
            "THIRD_PARTY_NOTICES.txt",
            "sounds"
          )

          foreach ($item in $required) {
            $path = Join-Path $root $item
            if (-not (Test-Path $path)) {
              throw "Portable package is missing: $item"
            }
          }

          $unexpected = @(
            Get-ChildItem $root |
              Where-Object { $_.Name -notin $required }
          )

          if ($unexpected.Count -ne 0) {
            $names = ($unexpected.Name -join ", ")
            throw "Portable package contains unexpected top-level items: $names"
          }

          $config = Get-Content (Join-Path $root "config.txt") -Raw
          $requiredDefaults = @(
            '(?m)^output=default$',
            '(?m)^monitor=none$',
            '(?m)^show_console_on_start=false$'
          )

          foreach ($pattern in $requiredDefaults) {
            if ($config -notmatch $pattern) {
              throw "Portable config is missing required safe default: $pattern"
            }
          }

          $sounds = @(
            Get-ChildItem (Join-Path $root "sounds") -File -Recurse
          )

          if ($sounds.Count -eq 0) {
            throw "Portable package contains no example sounds."
          }

          $invalidSounds = @(
            $sounds |
              Where-Object { $_.Extension.ToLowerInvariant() -notin @(".wav", ".mp3", ".flac") }
          )

          if ($invalidSounds.Count -ne 0) {
            $names = ($invalidSounds.FullName -join ", ")
            throw "Portable package contains unsupported sound files: $names"
          }

          $hash = Get-FileHash $zip -Algorithm SHA256
          $checksum = "$zip.sha256"
          "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($zip))" |
            Set-Content $checksum -Encoding ascii

          "PORTABLE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PORTABLE_SHA256=$checksum" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Portable ZIP: $zip"
          Write-Host "Size: $((Get-Item $zip).Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.PORTABLE_SHA256 }}
          if-no-files-found: error
          retention-days: 14

      - name: Create Microsoft Defender submission sample
        if: github.event_name == 'workflow_dispatch' && inputs.create_defender_sample == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.defender_sample_tag }}"

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }

          $sampleRoot = Join-Path $env:RUNNER_TEMP "defender-submission"
          $extractRoot = Join-Path $sampleRoot "extracted"
          Remove-Item $sampleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $sampleRoot -ItemType Directory | Out-Null

          $zipName = "SoundBoardFasaFiso-$tag-windows-x64-portable.zip"
          $checksumName = "$zipName.sha256"

          gh release download $tag --pattern $zipName --dir $sampleRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release asset: $zipName"
          }

          gh release download $tag --pattern $checksumName --dir $sampleRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release checksum: $checksumName"
          }

          $releaseZip = Join-Path $sampleRoot $zipName
          $releaseChecksum = Join-Path $sampleRoot $checksumName
          $expectedHash = ((Get-Content $releaseChecksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
            throw "Downloaded release ZIP checksum mismatch."
          }

          Expand-Archive -Path $releaseZip -DestinationPath $extractRoot
          $exe = Join-Path $extractRoot "SoundBoardFasaFiso\SoundBoardFasaFiso.exe"

          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Release package does not contain SoundBoardFasaFiso.exe."
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $submissionArchive = Join-Path $env:RUNNER_TEMP "SoundBoardFasaFiso-$tag-defender-submission.zip"
          Remove-Item $submissionArchive -Force -ErrorAction SilentlyContinue

          & $sevenZip a -tzip -pinfected -mem=AES256 $submissionArchive $exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $submissionArchive)) {
            throw "Creating the password-protected submission archive failed."
          }

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$submissionArchive.sha256.txt"
          @(
            "Source release tag: $tag"
            "Source release ZIP SHA-256: $actualHash"
            "Submitted EXE SHA-256: $exeHash"
            "Archive password: infected"
          ) | Set-Content $hashFile -Encoding ascii

          "DEFENDER_SAMPLE=$submissionArchive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEFENDER_SAMPLE_HASH=$hashFile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Microsoft Defender submission sample
        if: github.event_name == 'workflow_dispatch' && inputs.create_defender_sample == true
        uses: actions/upload-artifact@v7
        with:
          name: defender-submission-${{ inputs.defender_sample_tag }}
          path: |
            ${{ env.DEFENDER_SAMPLE }}
            ${{ env.DEFENDER_SAMPLE_HASH }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = $env:PORTABLE_ZIP
          $checksum = $env:PORTABLE_SHA256
          $title = "SoundBoardFasaFiso $tag"

          gh release view $tag 2>$null | Out-Null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $checksum --clobber
          }
          elseif ($tag -match "-") {
            gh release create $tag $zip $checksum `
              --title $title `
              --generate-notes `
              --prerelease
          }
          else {
            gh release create $tag $zip $checksum `
              --title $title `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed."
          }
